<!doctype html>
<!--
  ⚠️ NOTE FOR AI / DEVELOPERS (read before editing or upgrading this file)
  Arabic is written and read RIGHT-TO-LEFT (RTL), not left-to-right.
  - Every Arabic text block must use class "ar" (it sets direction:rtl). Never remove it.
  - Letter rows (see PG[]) are stored in LOGICAL reading order: first item = RIGHTMOST letter.
    Do NOT reverse the arrays, do NOT use flex-row-reverse / manual reordering to "fix" order.
  - Keep new Arabic content (letters, harakat, Iqro pages, ayat) inside ".ar" so the order stays correct.
  - Only the app UI (Indonesian text, nav, buttons) is LTR. Page flow of Iqro books must keep RTL logic.
  - Grids/lists of hijaiyah letters (home scroller, huruf grid, books preview) use dir="rtl" so Alif is
    top-RIGHT and reading continues leftwards/downwards. Tile buttons use dir="ltr" only for their Latin label. Keep both.
  - Keep the Amiri font and don't strip harakat (َ ِ ُ ْ ّ) — they change the reading.
-->

<meta charset="utf-8">

<body class="bg-bg text-ink font-sans">
<div class="max-w-md mx-auto px-4 pt-4 pb-32" style="padding-top:calc(1rem + env(safe-area-inset-top,0px))">
  <header class="flex items-center justify-between mb-5">
    <div class="flex items-center gap-2.5"><div class="w-11 h-11 rounded-2xl bg-brand text-on grid place-items-center shadow-[0_4px_0_var(--bd)]" id="logo"></div><span class="font-black text-2xl tracking-tight">QURO</span></div>
    <button class="ib" data-act="bell" aria-label="Notifikasi" id="bell"></button>
  </header>
  <main id="app"></main>
</div>
<nav id="nv" class="fixed inset-x-0 bottom-0 px-3" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);transform:translateZ(0);will-change:transform;z-index:40">
  <div class="max-w-md mx-auto"><div id="bi" class="flex items-center gap-2 px-3 py-2 bg-card border-2 border-line rounded-[28px] shadow-[0_6px_0_var(--line),0_12px_24px_rgba(0,0,0,.08)]"></div></div>
</nav>
<div id="m" data-act="mclose" class="hidden fixed inset-0 z-[90] bg-black/55 backdrop-blur-sm flex items-end justify-center"></div>
<div id="sp" class="fixed inset-0 z-[100] flex flex-col items-center justify-center overflow-hidden text-white" style="background:linear-gradient(170deg,#6FDB73,#2FA84A 70%,#23893a)">
  <span class="fl text-[120px] left-[6%] top-[8%]">ا</span><span class="fl text-[90px] right-[8%] top-[14%]" style="animation-delay:.7s">ب</span><span class="fl text-[100px] left-[12%] bottom-[16%]" style="animation-delay:1.2s">م</span><span class="fl text-[130px] right-[6%] bottom-[10%]" style="animation-delay:.4s">ق</span>
  <div class="absolute -bottom-24 -left-16 w-64 h-64 rounded-full bg-white/10"></div><div class="absolute -top-20 -right-10 w-56 h-56 rounded-full bg-white/10"></div>
  <div id="spm" class="relative"></div>
  <h1 class="relative font-black text-6xl tracking-wider mt-2" style="text-shadow:0 6px 0 #1F7A32">QURO</h1>
  <p class="relative font-extrabold text-sm mt-2 opacity-95">Bismillah siap belajar Al-Qur’an! ✨</p>
  <div class="relative w-44 h-3 rounded-full bg-white/30 mt-8 overflow-hidden"><span class="block h-full w-0 rounded-full bg-gold" style="animation:ld 2.6s ease-in-out forwards"></span></div>
  <button data-act="sp" class="btn btn-w relative mt-6 !py-2.5">Bismillah siap!</button>
</div>
<div id="t" class="hidden fixed left-1/2 -translate-x-1/2 bottom-28 bg-brand text-on text-sm font-extrabold px-5 py-3 rounded-full shadow-[0_5px_0_var(--bd)] z-50"></div>
<!-- Profile Share Modal v2 -->
<div id="shareProfileModal" class="sm" aria-hidden="true">
  <div class="sm-in" role="dialog" aria-modal="true" aria-labelledby="smT">
    <div class="sm-top">
      <div><h2 id="smT" class="sm-t">Bagikan profilmu</h2><p class="sm-s">Ajak teman belajar Iqro bareng!</p></div>
      <button class="sm-x" data-sa="close" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="sm-card">
      <div class="sm-av" id="smAv"></div>
      <b class="sm-n" id="smName"></b><p class="sm-p" id="smProg"></p>
      <div id="smQRWrap" hidden><div class="sm-qr" id="smQR"></div><p class="sm-cap">Scan untuk membuka QURO</p></div>
      <div class="sm-link"><span id="smUrl"></span><button data-sa="copy" id="smCopy">Salin</button></div>
    </div>
    <div class="sm-opts">
      <button class="sm-opt" data-sa="wa"><i style="background:#25D366"><svg viewBox="0 0 24 24"><path d="M4 20l1.4-4.2A8.5 8.5 0 1 1 8.2 18.7z"/><path d="M9 9c0 3 3 6 6 6l1.2-1.6-2-1-1 .8c-1-.5-1.8-1.3-2.3-2.3l.8-1-1-2z" fill="currentColor"/></svg></i>WhatsApp</button>
      <button class="sm-opt" data-sa="tg"><i style="background:#2AABEE"><svg viewBox="0 0 24 24"><path d="M21 4 3 11l6 2.2L11 20l3-4 5 4z"/><path d="M9 13.2 21 4"/></svg></i>Telegram</button>
      <button class="sm-opt" data-sa="copy"><i style="background:var(--brand);color:var(--on)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></i>Salin link</button>
      <button class="sm-opt" data-sa="more"><i style="background:#FFC933;color:#5a3a00"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg></i>Lainnya</button>
    </div>
    <div class="sm-done"><button class="sm-close" data-sa="close">Selesai</button></div>
  </div>
</div>
