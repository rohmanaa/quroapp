<!doctype html>
<!--
  ⚠️ NOTE FOR AI / DEVELOPERS (read before editing or upgrading this file)
  Arabic is written and read RIGHT-TO-LEFT (RTL), not left-to-right.
  - Every Arabic text block must use class "ar" (it sets direction:rtl). Never remove it.
  - Letter rows (see PG[]) are stored in LOGICAL reading order: first item = RIGHTMOST letter.
    Do NOT reverse the arrays, do NOT use flex-row-reverse / manual reordering to "fix" order.
  - Keep new Arabic content (letters, harakat, Iqro pages, ayat) inside ".ar" so the order stays correct.
  - Only the app UI (Indonesian text, nav, buttons) is LTR. Page flow of Iqro books must keep RTL logic.
  - Grids/lists of hijaiyah letters (home scroller, huruf grid, books preview) use dir="rtl" so Alif is
    top-RIGHT and reading continues leftwards/downwards. Tile buttons use dir="ltr" only for their Latin label. Keep both.
  - Keep the Amiri font and don't strip harakat (َ ِ ُ ْ ّ) — they change the reading.
-->

<style>
:root{--bg:#F3FBEF;--card:#fff;--ink:#1E3A2B;--mute:#6F8A7A;--brand:#3DB54A;--bd:#2B8F39;--on:#fff;--soft:#E2F6DB;--line:#DDEFD5;--l:40%;--tl:92%;box-sizing:border-box}

:root[data-theme="dark"]{--bg:#0f1c14;--card:#17281d;--ink:#eaf6ee;--mute:#9bb8a5;--brand:#58d068;--bd:#2f9a41;--on:#07210f;--soft:#1e3727;--line:#29442f;--l:68%;--tl:20%;color-scheme:dark}

body{min-height:100%}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid #F5B83D;outline-offset:2px}
/* NOTE FOR AI: Arabic = RTL. Keep direction:rtl on .ar; never reverse letter order manually. */
.ar{font-family:Amiri,"Noto Naskh Arabic",serif;font-weight:700;-webkit-text-stroke:.8px currentColor;direction:rtl}
.lt{color:hsl(var(--h) 72% var(--l))}
.tile{color:hsl(var(--h) 72% var(--l));background:hsl(var(--h) 85% var(--tl))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:var(--brand);color:var(--on);font-weight:900;padding:.8rem 1.3rem;border-radius:999px;box-shadow:0 5px 0 var(--bd);transition:transform .1s,box-shadow .1s}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}.btn-w{background:#fff;color:#2B8F39;box-shadow:0 5px 0 #BFE6B5}.btn-w:active{box-shadow:0 1px 0 #BFE6B5}
.hero{background:linear-gradient(150deg,#63D468,#2FA84A);color:#fff;position:relative;overflow:hidden}.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;background:#fff;opacity:.12}.hero:before{width:150px;height:150px;right:-40px;top:-50px}.hero:after{width:90px;height:90px;left:-30px;bottom:-40px}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}.pop{animation:pop .35s ease-out}@keyframes up{from{transform:translateY(100%)}}.up{animation:up .35s cubic-bezier(.2,.9,.3,1)}.st svg{fill:#FFB72B;stroke:#E59A00}.st.off svg{fill:var(--line);stroke:var(--line)}

@keyframes ld{to{width:100%}}#sp{transition:transform .6s cubic-bezier(.7,0,.3,1),opacity .6s}#sp.out{transform:translateY(-100%);opacity:.6}
@keyframes pu{50%{opacity:.4}}.live{background:#FF4D4D;color:#fff;font-weight:900;font-size:10px;padding:2px 8px;border-radius:99px;animation:pu 1.2s infinite}.fl2{animation:bob 3s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}.mas{animation:bob 2.6s infinite ease-in-out}
tile,.tile{border:2px solid hsl(var(--h) 70% 80%/.0)}.tile{box-shadow:0 4px 0 hsl(var(--h) 60% 75%);transition:transform .1s}.tile:active{transform:translateY(3px);box-shadow:0 1px 0 hsl(var(--h) 60% 75%)}
.mc{display:block;perspective:700px;height:84px;width:100%}
.mc>i{display:block;position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.on>i,.mc.ok>i{transform:rotateY(180deg)}
.mc s,.mc b{position:absolute;inset:0;display:grid;place-items:center;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-decoration:none}
.mc s{background:linear-gradient(145deg,#66D86B,#2FA84A);color:#fff;box-shadow:0 4px 0 #23893a}
.mc b{transform:rotateY(180deg);font-weight:400;color:hsl(var(--h) 72% var(--l));background:hsl(var(--h) 85% var(--tl));border:2px solid hsl(var(--h) 60% 75%)}
.mc.ok b{box-shadow:0 0 0 3px #3DB54A}
:root{--g1:#D6F3D0;--g2:#E1E7FF;--g3:#FFF0C4;--g4:#F4FBF1;--g5:#EDF2FB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#15402a;--g2:#1b2547;--g3:#3a3015;--g4:#0f1c14;--g5:#0c1620}}

html{height:100%}body{min-height:100vh;min-height:100dvh;background-color:var(--bg);background-image:radial-gradient(55% 32% at 8% 2%,var(--g1),transparent 72%),radial-gradient(50% 30% at 100% 22%,var(--g2),transparent 72%),radial-gradient(60% 34% at 0% 70%,var(--g3),transparent 72%),radial-gradient(45% 30% at 100% 100%,var(--g1),transparent 72%),linear-gradient(180deg,var(--g4),var(--g5));background-attachment:fixed;background-size:auto}

<style>

<style>
/* Share profile v2 — theme-aware, no iconify, real QR */
.sm{position:fixed;inset:0;z-index:10000;display:none;background:var(--bg);color:var(--ink);overflow:auto}
.sm.open{display:block}
.sm-in{min-height:100dvh;max-width:28rem;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;animation:smIn .22s ease-out}
@keyframes smIn{from{opacity:0;transform:translateY(14px)}}
.sm-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sm-t{font-size:26px;font-weight:900;line-height:1.15;margin:0}
.sm-s{color:var(--mute);font-weight:700;font-size:14px;margin:4px 0 0}
.sm-x{width:44px;height:44px;flex:none;border-radius:16px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.sm-card{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:28px;padding:20px;text-align:center;box-shadow:0 6px 0 var(--line)}
.sm-av{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.sm-n{display:block;font-size:20px;font-weight:900;margin-top:8px}
.sm-p{color:var(--mute);font-weight:700;font-size:13px;margin:0}
.sm-qr{width:min(100%,210px);aspect-ratio:1;margin:16px auto 0;padding:12px;background:#fff;border-radius:20px;border:2px solid var(--line)}
.sm-qr img,.sm-qr canvas{width:100%!important;height:auto!important;display:block}
.sm-cap{font-size:12px;font-weight:800;color:var(--mute);margin:8px 0 0}
.sm-link{display:flex;align-items:center;gap:8px;margin-top:16px;background:var(--soft);border-radius:16px;padding:6px 6px 6px 14px;text-align:left}
.sm-link span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:13px;color:var(--mute)}
.sm-link button{background:var(--brand);color:var(--on);font-weight:900;border-radius:12px;padding:10px 14px;font-size:13px;min-width:78px}
.sm-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.sm-opt{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:800}
.sm-opt i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s,box-shadow .1s}
.sm-opt:active i{transform:translateY(3px);box-shadow:none}
.sm-opt svg,.sm-x svg,.sm-link svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sm-x svg{width:22px;height:22px}
.sm-done{margin-top:auto;padding-top:24px}
.sm-close{width:100%;min-height:54px;border-radius:999px;background:var(--soft);color:var(--brand);font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--line)}
.sm-close:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
@media(max-width:360px){.sm-opt i{width:50px;height:50px}}
</style>

<style>

<style>

<style>
@keyframes trSlide{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}

function stopSeq(){seq++;play=false;hi=0;try{speechSynthesis.cancel()}catch(e){}}
function sayCb(t,cb){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=rs;u.onend=cb;u.onerror=cb;speechSynthesis.speak(u)}catch(e){cb()}}
function playSeq(p){const cs=p.content.slice().sort((a,b)=>a.position.row-b.position.row||a.position.col-b.position.col),tk=++seq;let i=0;play=true;
 const nx=()=>{if(tk!==seq)return;if(i>=cs.length){play=false;hi=0;render();return}const c=cs[i++];hi=c.order_id;render();sayCb(cl(c.arabic),nx)};nx()}
function turn(d){stopSeq();if(d<0){if(pn>1)pn--;else return toast("Ini halaman pertama")}else{const nk=IQ[jl+"-"+(pn+1)];if((nk&&nk.s===404)||pn>=JL[jl].n)return toast("Ini halaman terakhir yang tersedia");pn++}scrollTo(0,0);render();anim(d>0?-1:1)}

function loadPg(l,q,quiet){
  const k=l+"-"+q,c=IQ[k];if(c&&(c.content||c.s==="load"||c.s===404))return;
  try{const x=localStorage.getItem("iqro_pg_"+k);if(x){IQ[k]=JSON.parse(x);return}}catch(e){}
  IQ[k]={s:"load"};
  fetch(IQB+l+"/"+k+".json").then(r=>{if(!r.ok){IQ[k]={s:r.status===404?404:"net"};throw 0}return r.json()})
   .then(j=>{IQ[k]=j;try{localStorage.setItem("iqro_pg_"+k,JSON.stringify(j))}catch(e){}})
   .catch(()=>{if(IQ[k].s==="load")IQ[k]={s:"net"}})
   .finally(()=>{if(S==="reader"&&jl+"-"+pn===k)render()});
}

<div id="shareProfileModal" class="sm" aria-hidden="true">

<script>
(function(){
  const $m=()=>document.getElementById('shareProfileModal');
  const url=()=>location.href.split('#')[0];
  const nm=()=>(typeof U!=='undefined'&&U&&U.name)?U.name:'Aku';
  const msg=()=>nm()+' sedang belajar Iqro di QURO. Yuk belajar bareng!';
  let back=null,qrUrl='',ct=null;

  function copyText(t){
    if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
    return new Promise((ok,no)=>{try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const r=document.execCommand('copy');a.remove();r?ok():no()}catch(e){no(e)}});
  }
  function say(t){if(typeof toast==='function')toast(t)}
  function doCopy(){
    copyText(url()).then(()=>{
      const b=document.getElementById('smCopy');b.textContent='Tersalin ✓';clearTimeout(ct);ct=setTimeout(()=>b.textContent='Salin',1800);say('Link berhasil disalin');
    }).catch(()=>say('Gagal menyalin. Tekan lama link untuk menyalin.'));
  }
  function drawQR(){
    const w=document.getElementById('smQRWrap'),b=document.getElementById('smQR');
    if(qrUrl===url()&&b.firstChild){w.hidden=false;return}
    b.innerHTML='';
    try{new QRCode(b,{text:url(),width:256,height:256,colorDark:'#12301c',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});qrUrl=url();w.hidden=false}
    catch(e){w.hidden=true}
  }
  function openWin(u){const w=window.open(u,'_blank','noopener,noreferrer');if(!w){doCopy()}}

  window.openShareProfileModal=function(){
    const el=$m();if(!el)return;
    back=document.activeElement;
    const g=(typeof U!=='undefined'&&U&&U.g==='P')?'girl':'boy';
    document.getElementById('smAv').innerHTML=(typeof fe==='function')?fe(g,'w-12 h-12'):'';
    document.getElementById('smName').textContent=nm()==='Aku'?'Profil belajarku':nm();
    document.getElementById('smProg').textContent='Iqro '+jl+' · '+jp(jl)+'%';
    document.getElementById('smUrl').textContent=url().replace(/^https?:\/\//,'');
    drawQR();
    el.classList.add('open');el.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');
    const x=el.querySelector('.sm-x');if(x)x.focus();
  };
  window.closeShareProfileModal=function(){
    const el=$m();if(!el)return;
    el.classList.remove('open');el.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');
    if(back&&back.focus)back.focus();
  };

  document.addEventListener('click',function(e){
    const t=e.target.closest('#shareProfileModal [data-sa]');if(!t)return;
    const a=t.dataset.sa,text=encodeURIComponent(msg()),u=encodeURIComponent(url());
    if(a==='close')closeShareProfileModal();
    else if(a==='copy')doCopy();
    else if(a==='wa')openWin('https://wa.me/?text='+text+'%20'+u);
    else if(a==='tg')openWin('https://t.me/share/url?url='+u+'&text='+text);
    else if(a==='more'){
      if(navigator.share)navigator.share({title:'QURO',text:msg(),url:url()}).catch(()=>{});
      else doCopy();
    }
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeShareProfileModal()});
})();
